name: Sync Podcast Episodes

on:
  schedule:
    # Runs every 6 hours. GitHub may delay this by a few minutes at busy times.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-podcast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch episodes from Spreaker
        run: |
          curl -s "https://api.spreaker.com/v2/shows/7137764/episodes?limit=20" -o raw.json

      - name: Build podcast-episodes.json
        run: python3 scripts/build_podcast_json.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add podcast-episodes.json
          git diff --staged --quiet || git commit -m "Auto sync podcast episodes"
          git push
